name: First GitHub Action

on:
  push:
    branches:
      - main

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  hello-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello, GitHub Actions!"

      - name: Print date
        run: date

      - name: List files
        run: ls -la

      - name: Print server name
        run: uname -a

      - name: Force output
        run: |
          echo "=== TEST OUTPUT ==="
          pwd
          whoami
          env | sort
