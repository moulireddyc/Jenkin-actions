name: First GitHub Action

on:
  push:
    branches:
      - main

jobs:
  hello-job:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello, GitHub Actions!"
      
      - name: Print date
        run: date
      - name: List files
        run: ls -la
      - name: print server name
        run: uname -a
